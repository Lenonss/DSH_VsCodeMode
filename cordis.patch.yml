# dsh bundle patch：标准 bundle 自挂载。
#
# 只要任意 DSH profile 把本包加进 dsh.profile.bundles（`dsh plugin add` 即自动完成），
# 重启后这里就把插件行插入 loader 树 —— 不再依赖用户往 profile 用户层
# cordis.patch.yml 手写 insert（旧的非标准设计，已废弃）。
#
# 行的 `name` 必须是包名原样：它既是 Host 半的 Node 导入说明符（经 package main
# 解析到 lib/index.js），也是 dsh-client-modules 扫描"浏览器半"的键（经
# exports["./client"] 解析到 lib/client.js，见本包 dsh.client 声明）——所以
# Host/Client 两个半共享这一行即可，无需第二个 loader 行。
#
# `id` 是稳定身份：profile 用户层（或任何更晚的补丁层）用该 id 做"id 定向覆盖"
# 即可合并自定义 config（例如自定义图标目录）：
#   - id: dsh-vscode-mode
#     config:
#       imageDir: /path/to/icons
# 注意：是覆盖（override），不是再 insert 一次同 id 的行，否则触发
# duplicate loader entry id 启动失败。
#
# DSH 0.1.7 免重载配置字段（已实证，格式与本文件无关）：插件在自己的 Config
# schema 字段上声明 `.volatile()`（如 `z.string().volatile()`，类型
# `import type { Volatile } from '@deepseek-ai/cordis'`），仅 volatile 字段的
# 变化由 Loader 就地提交（`ctx.on('loader/volatile-update')`），运行中的实例保留、
# 不重挂载；非 volatile 字段改动仍按原逻辑触发 reload（volatile 字段还要求位于
# 固定 object 路径，不得嵌套于 dict key / 外层 volatile 之内，app-boot 会校验）。
# 该声明落在插件源码的 schema 上，**不是 patch 文件字段**。
# ⚠️ 0.1.7 实测（2026-09-23，0.1.7-alpha.2 修复）：volatile 不只是免重载——
# SettingsForms.describe 按 volatileForm 门槛下发 entry，**Config 全字段（12 个，
# 见 src/fileOpenSettings.ts buildSettingsSchema 的 { volatile: true } 模式）必须标记**，
# 漏标 = 本插件 ns 永不进 describe = 设置页「设置服务暂不可用」+ 写入抛
# has no volatile fields；本行 config 若新增字段，同样须在 Config schema 对应字段
# 加 `.volatile()` 才会免重载并出现在设置页。
# 另：0.1.7 起 `dsh.bundle.patch` 支持 `patch: string | string[]`（有序列表，
# 逐层施加），本包单文件写法保持兼容，无需改动。
- insert:
    - id: dsh-vscode-mode
      name: 'dsh-vscode-mode'

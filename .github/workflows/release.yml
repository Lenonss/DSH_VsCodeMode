name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "Building package version ${package_version} for tag v${tag_version}."
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag v${tag_version} does not match package.json version ${package_version}."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (host + client)
        run: pnpm build

      - name: Pack tgz
        run: npm pack

      - name: GitHub Release (attach tgz)
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true

      # 仅当仓库配置了 NPM_TOKEN 时发布到 npm（env 传入、脚本内判断；
      # GitHub Actions 的 secrets 上下文不允许出现在 if 条件，解析即失败）
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret not configured — skipping npm publish (GitHub Release still attached)."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          npm publish --access public

      # 发布后回读注册表 tarball，校验 main/exports 入口文件存在——
      # 镜像/CDN 刚发布时同步不完整会让用户端更新报"缺少入口文件"并回滚。
      # 发布后同步有秒级~分钟级延迟，用重试窗口覆盖，超时仍未就绪则判失败。
      - name: Verify published tarball (entry files present)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "npm publish skipped — nothing to verify."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          npm config set //registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          ok=0
          for attempt in $(seq 1 15); do
            tarball="$(npm view "dsh-vscode-mode@${version}" dist.tarball 2>/dev/null || true)"
            if [ -n "${tarball}" ] && curl -fsSL "${tarball}" -o /tmp/verify.tgz; then
              ok=1
              break
            fi
            echo "attempt ${attempt}/15: registry tarball for v${version} not ready yet, retrying in 30s..."
            sleep 30
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::published tarball for v${version} not retrievable after retries"
            exit 1
          fi
          echo "tarball: $(tar -tzf /tmp/verify.tgz | head -1)"
          missing=0
          for entry in package/lib/index.js package/lib/client.js; do
            if ! tar -tzf /tmp/verify.tgz | grep -qx "${entry}"; then
              echo "::error::published tarball missing ${entry}"
              missing=1
            fi
          done
          if [ "${missing}" != "0" ]; then
            echo "::error::npm registry served an incomplete tarball for v${version}; unpublish or republish."
            exit 1
          fi
          echo "Verified v${version}: lib/index.js + lib/client.js present on registry."

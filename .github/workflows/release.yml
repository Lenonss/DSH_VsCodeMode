name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "Building package version ${package_version} for tag v${tag_version}."
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag v${tag_version} does not match package.json version ${package_version}."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install SVN test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          svn --version --quiet
          svnadmin --version --quiet

      - name: Test
        run: pnpm test

      - name: Build (host + client)
        run: pnpm build

      - name: Pack tgz
        run: npm pack

      - name: GitHub Release (attach tgz)
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true

      # Trusted Publishing（OIDC）：不再依赖 NPM_TOKEN。npm CLI 会为本次 release
      # 向 GitHub Actions 换取短时凭据，仅对 npmjs.com 上为该包配置的
      # "Lenonss / DSH_VsCodeMode / release.yml" 这一条 trusted publisher 生效。
      # Node 22 自带 npm 10.x，OIDC 需要 ≥ 11.5.1，故先升级 npm。
      - name: Upgrade npm for OIDC
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: npm publish --access public

      # 发布后回读注册表 tarball，校验 main/exports 入口文件存在——
      # 镜像/CDN 刚发布时同步不完整会让用户端更新报"缺少入口文件"并回滚。
      # 发布后同步有秒级~分钟级延迟，用重试窗口覆盖，超时仍未就绪则判失败。
      - name: Verify published tarball (entry files present)
        run: |
          version="$(node -p "require('./package.json').version")"
          ok=0
          for attempt in $(seq 1 15); do
            tarball="$(npm view "dsh-vscode-mode@${version}" dist.tarball 2>/dev/null || true)"
            if [ -n "${tarball}" ] && curl -fsSL "${tarball}" -o /tmp/verify.tgz; then
              ok=1
              break
            fi
            echo "attempt ${attempt}/15: registry tarball for v${version} not ready yet, retrying in 30s..."
            sleep 30
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::published tarball for v${version} not retrievable after retries"
            exit 1
          fi
          echo "tarball: $(tar -tzf /tmp/verify.tgz | head -1)"
          missing=0
          for entry in package/lib/index.js package/lib/client.js; do
            if ! tar -tzf /tmp/verify.tgz | grep -qx "${entry}"; then
              echo "::error::published tarball missing ${entry}"
              missing=1
            fi
          done
          if [ "${missing}" != "0" ]; then
            echo "::error::npm registry served an incomplete tarball for v${version}; unpublish or republish."
            exit 1
          fi
          echo "Verified v${version}: lib/index.js + lib/client.js present on registry."
